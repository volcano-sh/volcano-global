name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          GO111MODULE="on" go install sigs.k8s.io/kind@v0.31.0
          curl -LO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          sudo install kubectl /usr/local/bin/kubectl

      - name: Setup Karmada
        run: |
          ./hack/setup-karmada.sh

      - name: Setup Volcano on member clusters
        run: |
          ./hack/setup-volcano.sh

      - name: Deploy Volcano-Global
        run: |
          ./hack/deploy-volcano-global.sh

      - name: Run e2e tests
        run: |
          export ARTIFACTS_PATH=${{ github.workspace }}/volcano-global-e2e-logs
          export SKIP_SETUP=true
          make e2e-test

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volcano-global-e2e-logs
          path: ${{ github.workspace }}/volcano-global-e2e-logs

